[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), payment=()"

[[headers]]
  for = "/truce/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[redirects]]
  from = "/api/interest"
  to = "/.netlify/functions/interest"
  status = 200
  force = true

[[redirects]]
  from = "/api/event"
  to = "/.netlify/functions/event"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-health"
  to = "/.netlify/functions/demo-health"
  status = 200
  force = true

[[redirects]]
  from = "/api/answered-voice"
  to = "/.netlify/functions/answered-voice"
  status = 200
  force = true

# /api/answered-brain has NO redirect block on purpose. It is a Netlify v2
# function that declares its own routes in-file (export const config.path:
# /api/answered-brain and /api/answered-brain/chat/completions, the suffix
# ElevenLabs appends to a custom LLM server URL). Declaring a custom path
# removes the default /.netlify/functions/answered-brain route, so a forced
# redirect pointing there would shadow the live route with a dead target.

[[redirects]]
  from = "/internal"
  to = "/.netlify/functions/site-directory"
  status = 200
  force = true

# ── the cockpit and the outbound call runtime (@ANSWERED-RESEARCH) ────────────
# /internal/cockpit is gated server-side inside the function, same posture as
# /internal: nothing is serialized until the PIN check passes.

[[redirects]]
  from = "/internal/cockpit"
  to = "/.netlify/functions/cockpit"
  status = 200
  force = true

# /internal/ops — the daily operating view (@LANE-OPS). Gated server side inside
# the function exactly like /internal and /internal/cockpit: nothing is
# serialized before the PIN check. Read only: it cannot dial, text, or spend.
[[redirects]]
  from = "/internal/ops"
  to = "/.netlify/functions/ops"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-voice"
  to = "/.netlify/functions/call-voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-turn"
  to = "/.netlify/functions/call-turn"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-status"
  to = "/.netlify/functions/call-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-transcription"
  to = "/.netlify/functions/call-transcription"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-recording"
  to = "/.netlify/functions/call-recording"
  status = 200
  force = true

[[redirects]]
  from = "/api/recording"
  to = "/.netlify/functions/recording"
  status = 200
  force = true

# The text-negotiation product's runtime (@ANSWERED-RESEARCH). parley.html calls this with fetch.
[[redirects]]
  from = "/api/truce"
  to = "/.netlify/functions/truce"
  status = 200
  force = true

# ── THE DEAL ITSELF (@LANE-PARLEY) ───────────────────────────────────────────
# sv_truce_create already hands both parties a link of the shape
# https://answered.reddenda.com/truce/<token>, and until this block that URL was
# a measured 404: the engine's own invitation landed nowhere. The token IS the
# credential, so the deal is served BY parley.html, which reads it off the path.
# There is no second page and no new file: the page that sells the product is
# the page that runs it.
#
# NOT a splat onto a function, and deliberately no /truce root: a bare /truce
# with no token has nothing to show, and a rewrite that swallowed it would put
# an empty deal shell on a URL people will guess.
[[redirects]]
  from = "/truce/*"
  to = "/parley.html"
  status = 200
  force = true

# NOTE, deliberately left as a comment rather than a route: this lane briefly had
# its own /api/parley-terms door onto tr_terms, so it would not be writing
# @ANSWERED-RESEARCH's file. They folded `terms` in as a sixth op on /api/truce
# within the hour, so the duplicate was deleted before it ever deployed. Two
# doors onto one RPC is how one of them gets fixed and the other is forgotten.

# ── one click activation (@ANSWERED-ACTIVATION) ──────────────────────────────
# One function, three routes. The two webhook routes are declared FIRST and
# they are exact matches, never a splat: /api/call-me must not be able to
# swallow /api/call-me/twiml, because that endpoint is what Twilio asks for
# when a real person picks up.
#
# The role is decided inside the function from the request path, not from a
# query string added here, so a rewrite that drops or merges query parameters
# can never turn the TwiML webhook into the public JSON API.

[[redirects]]
  from = "/api/call-me/twiml"
  to = "/.netlify/functions/call-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-me/status"
  to = "/.netlify/functions/call-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-me"
  to = "/.netlify/functions/call-me"
  status = 200
  force = true

# ── the meter, the ledger and the money (@LANE-BILLING) ──────────────────────
# /statement/:token deliberately has NO redirect block. bill-statement.mjs is a
# Netlify v2 function that declares its own routes in-file (export const config
# .path = ['/statement/:token','/api/statement']), and declaring a custom path
# removes the default /.netlify/functions/ route, so a forced redirect pointing
# there would shadow the live route with a dead target. Same reasoning, and the
# same hard-won lesson, as the answered-brain note above.
#
# The webhook route is declared FIRST and is an exact match, never a splat:
# /api/billing must not be able to swallow /api/billing/webhook, because the
# webhook is the only path in this file that is authenticated by a Stripe
# signature instead of the operator bearer token.

[[redirects]]
  from = "/api/billing/webhook"
  to = "/.netlify/functions/bill-stripe"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing"
  to = "/.netlify/functions/bill-stripe"
  status = 200
  force = true

[[redirects]]
  from = "/api/meter"
  to = "/.netlify/functions/bill-meter"
  status = 200
  force = true

# Mirrors the one-click consent store into the call spine (@ANSWERED-RESEARCH). Scheduled every
# 5 minutes; this route exists so it can also be run on demand.
[[redirects]]
  from = "/api/consent-sync"
  to = "/.netlify/functions/consent-sync"
  status = 200
  force = true
