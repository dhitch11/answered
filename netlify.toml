[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[redirects]]
  from = "/api/interest"
  to = "/.netlify/functions/interest"
  status = 200
  force = true

[[redirects]]
  from = "/api/event"
  to = "/.netlify/functions/event"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-health"
  to = "/.netlify/functions/demo-health"
  status = 200
  force = true
